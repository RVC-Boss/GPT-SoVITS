services:
  gpt-sovits-inference:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-9880}:9880"
    volumes:
      - ./GPT_SoVITS/pretrained_models:/app/GPT_SoVITS/pretrained_models:ro
      - ./GPT_SoVITS/text/G2PWModel:/app/GPT_SoVITS/text/G2PWModel:ro
      - ./GPT_SoVITS/configs/tts_infer.yaml:/app/GPT_SoVITS/configs/tts_infer.yaml:ro
      - ./references:/app/references:ro
      - ./tools/AP_BWE_main/24kto48k:/app/tools/AP_BWE_main/24kto48k:ro
      - ./.codex/runtime-cache:/app/.codex/runtime-cache
    gpus: all
    restart: unless-stopped
